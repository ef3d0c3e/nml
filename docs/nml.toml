# The documentation of NML, written in NML.
pages = ["**/*.nml"]
# The template every page includes.
exclude = ["template/**"]

[html]
language = "en"
stylesheets = ["docs.css"]
static = "static"

[render.tex.main]
preamble = "\\usepackage{amsmath}\\usepackage{tikz}"

# The documentation's own syntax: `:import docs.page`.
[[module]]
name = "docs"
root = "template"

# The programs of `:run` blocks: `writing/runners.nml` runs Python.
[run.python]
command = ["python3", "{file}"]
extension = "py"
