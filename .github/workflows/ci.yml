name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TYPST_VERSION: v0.15.1

jobs:
  check:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install the renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz dvisvgm \
            texlive-latex-base texlive-latex-extra texlive-pictures preview-latex-style
          curl -sSfL "https://github.com/typst/typst/releases/download/$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          dot -V && latex --version | head -1 && dvisvgm --version && typst --version
      - run: cargo test --workspace --locked
        env:
          # The renderers are installed: tests that would skip without one fail instead.
          NML_REQUIRE_RENDERERS: "1"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install the renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz dvisvgm \
            texlive-latex-base texlive-latex-extra texlive-pictures preview-latex-style
          curl -sSfL "https://github.com/typst/typst/releases/download/$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
      - run: cargo build --release --locked -p nml-cli
      - name: Build the documentation
        run: ./target/release/nml build docs
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/public

  # On a version tag, once everything above passed: the executables and the documentation, as
  # a GitHub release.
  build-release:
    name: Executable (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, docs]
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, so that the executable runs on older glibc.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - name: The tag is the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"name":"nml-cli","version":"[^"]*"' | grep -o '[0-9][^"]*')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag $GITHUB_REF_NAME is not the version v$version" >&2
            exit 1
          fi
      - run: cargo build --release --locked -p nml-cli
      - name: Package
        run: |
          name="nml-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/nml.exe "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp target/release/nml "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            nml-*.tar.gz
            nml-*.zip

  release:
    name: Release
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: docs
          path: docs
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "nml-$GITHUB_REF_NAME-docs.tar.gz" -C docs .
          sha256sum nml-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" nml-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
